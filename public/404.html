
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>finup</title>
    <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // pathSegmentsToKeep = 1, if your app is on github.io subdomain under url /{path} (single url extension)
    // on custom domain when the site is on "/" this value is pathSegmentsToKeep = 0
      var pathSegmentsToKeep = 0;

      var l = window.location;
      var routePath = l.pathname
        .slice(1)
        .split('/')
        .slice(pathSegmentsToKeep)
        .join('/');

      if (routePath.length > 1) {
        routePath = routePath.replace(/\/+$/, '');
      }

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        routePath.replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
